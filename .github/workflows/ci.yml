# CI: levels 1 and 2 of the test protocol (TESTING.md), unit tests then UI
# previews rendered to PNG, on main and on every pull request.
# Level 3 (real API) stays at publish time, with the maintainer: it needs a
# key and costs real tokens; CI doesn't need it to keep main healthy.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests + UI previews
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # KeyboardShortcuts 3.0.1 requires Swift tools 6.2: the runner's default
      # Xcode sometimes lags behind, so we pick the most recent one installed.
      - name: Select the most recent Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test protocol (levels 1 and 2)
        run: Scripts/test.sh --smoke

      # The rendered screens, as CI saw them: enough to judge a visual
      # regression at a glance without launching the app.
      - name: Publish rendered previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apercus-ui
          path: .build/previews/
          if-no-files-found: ignore
