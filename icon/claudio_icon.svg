<?xml version="1.0" encoding="UTF-8"?>
<!-- Icône macOS de Claudio — robot moustachu de Guillaume (proportions d'origine,
     tracés repris de moustache_badge3.svg ×1.609375), violet adouci en dégradé
     discret, contour blanc, relief par ombres portées et lumière haute.
     Master 1024×1024 ; squircle 824 centré (gabarit Apple), marges 100. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Fond : la teinte de Guillaume (#3e106f) éclaircie en haut, profonde en bas.
         userSpaceOnUse pour que le cache sous la moustache se raccorde sans couture. -->
    <linearGradient id="fond" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56309b"/>
      <stop offset="1" stop-color="#38105f"/>
    </linearGradient>
    <!-- Intérieur de la tête : un cran plus sombre, pour détacher le visage.
         Coordonnées locales du bonhomme (0-512). -->
    <linearGradient id="tete" x1="256" y1="131" x2="256" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c1668"/>
      <stop offset="1" stop-color="#2e0c50"/>
    </linearGradient>
    <!-- Reflet du haut : fondu, sans bord dur. -->
    <linearGradient id="gloss" x1="512" y1="126" x2="512" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Blanc légèrement modelé pour la moustache. -->
    <linearGradient id="blanc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eae4f6"/>
    </linearGradient>
    <filter id="ombreIcone" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="ombreDouce" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#1a0533" flood-opacity="0.45"/>
    </filter>
    <filter id="ombreFine" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1a0533" flood-opacity="0.40"/>
    </filter>
    <clipPath id="clipSquircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <!-- Coupe le bas de la tête à y=271 (coordonnées locales du bonhomme),
         comme le cache du design d'origine — la zone coupée passe sous la moustache. -->
    <clipPath id="clipTete">
      <rect x="120" y="60" width="272" height="211"/>
    </clipPath>
  </defs>

  <!-- Contour blanc (squircle plein cadre du badge3) + ombre portée de l'icône. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#ffffff" filter="url(#ombreIcone)"/>
  <!-- Fond violet adouci, inset pour laisser le liseré blanc. -->
  <rect x="126" y="126" width="772" height="772" rx="172" fill="url(#fond)"/>
  <!-- Lumière haute : léger gloss fondu pour le relief du fond. -->
  <rect x="126" y="126" width="772" height="772" rx="172" fill="url(#gloss)"/>

  <!-- Le bonhomme : tracés de moustache_badge3.svg à l'échelle 824/512,
       position verticale d'origine (tête haute — validée sur épreuve). -->
  <g transform="translate(100 100) scale(1.609375)">
    <!-- Antenne : flat, dessinée derrière la tête (la tige rejoint le contour). -->
    <rect x="250.5" y="114" width="11" height="23.613" fill="#ffffff"/>
    <circle cx="256" cy="96.745" r="21.255" fill="#ffffff"/>
    <!-- Tête (anneau blanc + intérieur sombre), coupée à y=271 comme dans le design
         d'origine — le clip enveloppe les éléments filtrés pour couper aussi l'ombre. -->
    <g clip-path="url(#clipTete)">
      <path filter="url(#ombreDouce)" fill-rule="evenodd" fill="#ffffff" d="M364.5,182.25l0,102.5c0,28.286 -22.964,51.25 -51.25,51.25l-114.5,0c-28.286,0 -51.25,-22.964 -51.25,-51.25l0,-102.5c0,-28.286 22.964,-51.25 51.25,-51.25l114.5,0c28.286,0 51.25,22.964 51.25,51.25Z
               M349,189.571l0,87.857c0,24.245 -19.684,43.929 -43.929,43.929l-98.143,0c-24.245,0 -43.929,-19.684 -43.929,-43.929l0,-87.857c0,-24.245 19.684,-43.929 43.929,-43.929l98.143,0c24.245,0 43.929,19.684 43.929,43.929Z"/>
      <path fill="url(#tete)" d="M349,189.571l0,87.857c0,24.245 -19.684,43.929 -43.929,43.929l-98.143,0c-24.245,0 -43.929,-19.684 -43.929,-43.929l0,-87.857c0,-24.245 19.684,-43.929 43.929,-43.929l98.143,0c24.245,0 43.929,19.684 43.929,43.929Z"/>
    </g>
    <!-- Moustache, en relief. -->
    <path filter="url(#ombreDouce)" fill="url(#blanc)" fill-rule="nonzero" d="M256,239.765c-26.2,-26.2 -72.05,-22.925 -98.25,6.55c-22.925,26.2 -55.675,32.75 -85.15,16.375c13.1,58.95 62.225,91.7 114.625,75.325c29.475,-9.825 52.4,-32.75 68.775,-58.95c16.375,26.2 39.3,49.125 68.775,58.95c52.4,16.375 101.525,-16.375 114.625,-75.325c-29.475,16.375 -62.225,9.825 -85.15,-16.375c-26.2,-29.475 -72.05,-32.75 -98.25,-6.55Z"/>
    <!-- Yeux : blancs en léger relief, pupilles dans le violet de la tête. -->
    <g filter="url(#ombreFine)">
      <circle cx="219" cy="187.481" r="23.5" fill="#ffffff"/>
      <circle cx="293" cy="187.481" r="23.5" fill="#ffffff"/>
    </g>
    <circle cx="228" cy="187.481" r="12.5" fill="#31104f"/>
    <circle cx="284" cy="187.481" r="12.5" fill="#31104f"/>
  </g>
</svg>
