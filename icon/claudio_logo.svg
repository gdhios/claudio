<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo Claudio — reprise directe de moustache_badge3.svg (robot moustachu de
     Guillaume, proportions inchangées), violet adouci en léger dégradé vertical,
     antenne derrière la tête, bas de tête coupé proprement (sans rect de cache).
     Version flat plein cadre pour le web/landing ; l'icône macOS avec relief est
     dans claudio_icon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="fond" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#56309b"/>
      <stop offset="1" stop-color="#38105f"/>
    </linearGradient>
    <clipPath id="clipTete"><rect x="120" y="60" width="272" height="211"/></clipPath>
  </defs>
  <!-- Contour blanc plein cadre + badge violet inset. -->
  <path fill="#ffffff" d="M512,134l0,244c0,73.957 -60.043,134 -134,134l-244,0c-73.957,0 -134,-60.043 -134,-134l0,-244c0,-73.957 60.043,-134 134,-134l244,0c73.957,0 134,60.043 134,134Z"/>
  <path fill="url(#fond)" d="M497,154l0,209c0,73.957 -60.043,134 -134,134l-209,0c-73.957,0 -134,-60.043 -134,-134l0,-209c0,-73.957 60.043,-134 134,-134l209,0c73.957,0 134,60.043 134,134Z"/>
  <!-- Antenne : derrière la tête, la tige rejoint le contour. -->
  <rect x="250.5" y="114" width="11" height="23.613" fill="#ffffff"/>
  <circle cx="256" cy="96.745" r="21.255" fill="#ffffff"/>
  <!-- Tête : anneau blanc + intérieur sombre, coupés à y=271 (sous la moustache). -->
  <g clip-path="url(#clipTete)">
    <path fill-rule="evenodd" fill="#ffffff" d="M364.5,182.25l0,102.5c0,28.286 -22.964,51.25 -51.25,51.25l-114.5,0c-28.286,0 -51.25,-22.964 -51.25,-51.25l0,-102.5c0,-28.286 22.964,-51.25 51.25,-51.25l114.5,0c28.286,0 51.25,22.964 51.25,51.25Z
             M349,189.571l0,87.857c0,24.245 -19.684,43.929 -43.929,43.929l-98.143,0c-24.245,0 -43.929,-19.684 -43.929,-43.929l0,-87.857c0,-24.245 19.684,-43.929 43.929,-43.929l98.143,0c24.245,0 43.929,19.684 43.929,43.929Z"/>
    <path fill="#341060" d="M349,189.571l0,87.857c0,24.245 -19.684,43.929 -43.929,43.929l-98.143,0c-24.245,0 -43.929,-19.684 -43.929,-43.929l0,-87.857c0,-24.245 19.684,-43.929 43.929,-43.929l98.143,0c24.245,0 43.929,19.684 43.929,43.929Z"/>
  </g>
  <!-- Moustache. -->
  <path fill="#ffffff" fill-rule="nonzero" d="M256,239.765c-26.2,-26.2 -72.05,-22.925 -98.25,6.55c-22.925,26.2 -55.675,32.75 -85.15,16.375c13.1,58.95 62.225,91.7 114.625,75.325c29.475,-9.825 52.4,-32.75 68.775,-58.95c16.375,26.2 39.3,49.125 68.775,58.95c52.4,16.375 101.525,-16.375 114.625,-75.325c-29.475,16.375 -62.225,9.825 -85.15,-16.375c-26.2,-29.475 -72.05,-32.75 -98.25,-6.55Z"/>
  <!-- Yeux. -->
  <circle cx="219" cy="187.481" r="23.5" fill="#ffffff"/>
  <circle cx="293" cy="187.481" r="23.5" fill="#ffffff"/>
  <circle cx="228" cy="187.481" r="12.5" fill="#341060"/>
  <circle cx="284" cy="187.481" r="12.5" fill="#341060"/>
</svg>
