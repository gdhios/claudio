<?xml version="1.0" encoding="UTF-8"?>
<!-- Mascotte Claudio — bibliothèque de vues. Deux châssis retenus :
     « buste » (plein, pour le panneau) et « trait » (contour, pour la barre de
     menus et les petites tailles). Les tracés sont ceux de claudio_logo.svg,
     repris sans retouche : antenne, anneau de tête, moustache.

     Grille : 512, centre à x=256. Le buste occupe x 73→440, y 75→342 ;
     le cadrage est donc viewBox="52 52 408 310" (celui du fichier) — la marge
     haute loge l'antenne du châssis « trait », plus haute que celle du buste ;
     et viewBox="0 0 512 512" si l'on veut la grille entière.

     Couleurs : quatre variables préfixées, chacune avec sa valeur de repli.
       cl-trait    silhouette
       cl-creux    intérieur de la tête
       cl-oeil     globe
       cl-pupille  regard
     Par défaut c'est la version claire sur fond sombre. Sur fond clair, le
     dessin bascule seul en négatif : silhouette violette, creux et globes
     évidés, seules les pupilles portent le regard.

     Quatre regards, un par état du panneau (voir session.phase) :
       y-repos  y-veille  y-fait  y-vide
     Huit vues composées prêtes à l'emploi : buste-* et trait-*.
     Les <use> vers un fichier tiers ne fonctionnent que sous Firefox : on
     inline ce SVG dans la page (comme le fait déjà la landing) et on appelle
     une vue par son identifiant. En <img src>, c'est la vue par défaut. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="52 52 408 310" width="408" height="310">
  <style>
    /* Les variables sont préfixées pour ne rien casser quand ce fichier est
       inliné dans une page. Le négatif suit le thème du lecteur ; poser les
       variables sur un parent plus proche permet de le forcer. */
    :root {
      --cl-trait: #ffffff;
      --cl-creux: #31104f;
      --cl-oeil: #ffffff;
      --cl-pupille: #31104f;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --cl-trait: #3e106f;
        --cl-creux: transparent;
        --cl-oeil: transparent;
        --cl-pupille: #3e106f;
      }
    }
  </style>

  <defs>
    <!-- ── Tracés d'origine, cités depuis claudio_logo.svg ────────────── -->
    <clipPath id="cl-coupe-tete"><rect x="120" y="60" width="272" height="211"/></clipPath>

    <!-- La moustache pleine, en gomme. Sur le buste elle est opaque et couvre
         d'elle-même le bas de la tête ; en trait ce n'est qu'un contour, et les
         montants de la tête resteraient visibles au milieu des lobes. Une coupe
         horizontale ne suit pas un contour courbe : c'est donc la moustache qui
         découpe la tête, et son propre trait recouvre la jointure. -->
    <mask id="cl-gomme-moustache" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect x="0" y="0" width="512" height="512" fill="#fff"/>
      <use href="#cl-p-moustache" fill="#000"/>
    </mask>

    <path id="cl-p-tete-anneau" fill-rule="evenodd" d="M364.5,182.25l0,102.5c0,28.286 -22.964,51.25 -51.25,51.25l-114.5,0c-28.286,0 -51.25,-22.964 -51.25,-51.25l0,-102.5c0,-28.286 22.964,-51.25 51.25,-51.25l114.5,0c28.286,0 51.25,22.964 51.25,51.25Z M349,189.571l0,87.857c0,24.245 -19.684,43.929 -43.929,43.929l-98.143,0c-24.245,0 -43.929,-19.684 -43.929,-43.929l0,-87.857c0,-24.245 19.684,-43.929 43.929,-43.929l98.143,0c24.245,0 43.929,19.684 43.929,43.929Z"/>
    <path id="cl-p-tete-interieur" d="M349,189.571l0,87.857c0,24.245 -19.684,43.929 -43.929,43.929l-98.143,0c-24.245,0 -43.929,-19.684 -43.929,-43.929l0,-87.857c0,-24.245 19.684,-43.929 43.929,-43.929l98.143,0c24.245,0 43.929,19.684 43.929,43.929Z"/>
    <path id="cl-p-moustache" fill-rule="nonzero" d="M256,239.765c-26.2,-26.2 -72.05,-22.925 -98.25,6.55c-22.925,26.2 -55.675,32.75 -85.15,16.375c13.1,58.95 62.225,91.7 114.625,75.325c29.475,-9.825 52.4,-32.75 68.775,-58.95c16.375,26.2 39.3,49.125 68.775,58.95c52.4,16.375 101.525,-16.375 114.625,-75.325c-29.475,16.375 -62.225,9.825 -85.15,-16.375c-26.2,-29.475 -72.05,-32.75 -98.25,-6.55Z"/>

    <!-- ── Châssis « buste » : le badge en moins, c'est tout ──────────── -->
    <g id="cl-buste">
      <rect x="250.5" y="114" width="11" height="23.613" fill="var(--cl-trait, #ffffff)"/>
      <circle cx="256" cy="96.745" r="21.255" fill="var(--cl-trait, #ffffff)"/>
      <g clip-path="url(#cl-coupe-tete)">
        <use href="#cl-p-tete-anneau" fill="var(--cl-trait, #ffffff)"/>
        <use href="#cl-p-tete-interieur" fill="var(--cl-creux, #31104f)"/>
      </g>
      <use href="#cl-p-moustache" fill="var(--cl-trait, #ffffff)"/>
    </g>

    <!-- ── Châssis « trait » : épaisseur constante 15, une seule couleur.
         Silhouette extérieure de la tête (l'anneau n'a plus lieu d'être) et
         antenne resserrée à r=17, sans quoi elle fait ballon à cette épaisseur.
         Monochrome : convient tel quel à une NSImage template. ───────── -->
    <!-- L'antenne n'est pas celle du buste : à 15 d'épaisseur, la tige d'origine
         ressortait sous la barre haute de la tête (elle descend à 142, la barre
         s'arrête à 138,5) et le cou ne mesurait plus que 6. Elle s'arrête donc
         à 127, dans l'épaisseur de la barre, et la boule remonte à 85 — le cou
         visible fait 14, le rapport du logo d'origine. -->
    <g id="cl-trait" fill="none" stroke="var(--cl-trait, #ffffff)" stroke-width="15"
       stroke-linejoin="round" stroke-linecap="round">
      <path d="M256,100 L256,127"/>
      <circle cx="256" cy="85" r="17"/>
      <g clip-path="url(#cl-coupe-tete)" mask="url(#cl-gomme-moustache)">
        <rect x="147" y="131" width="217.5" height="205" rx="51.25"/>
      </g>
      <use href="#cl-p-moustache"/>
    </g>

    <!-- ── Quatre regards. Rien d'autre ne bouge d'un état à l'autre :
         c'est ce qui tient le personnage ensemble.

         Quatre et pas six : à la taille d'une barre de menus le globe fait
         deux points et demi, et seule la *silhouette* de l'œil se lit.
         Déplacer une pupille dedans ne dit pas « il regarde ailleurs », ça
         dit « ses yeux sont de travers ». Les regards convergents, obliques
         et dispersés ont donc été retirés : chaque état change de forme.
         ──────────────────────────────────────────────────────────────── -->

    <!-- Repos — œil ouvert, pupille centrée. Il attend, il est disponible.
         Aussi le regard de la barre de menus. -->
    <g id="y-repos">
      <circle cx="219" cy="187.481" r="23.5" fill="var(--cl-oeil, #ffffff)"/>
      <circle cx="293" cy="187.481" r="23.5" fill="var(--cl-oeil, #ffffff)"/>
      <circle cx="219" cy="187.481" r="12.5" fill="var(--cl-pupille, #31104f)"/>
      <circle cx="293" cy="187.481" r="12.5" fill="var(--cl-pupille, #31104f)"/>
    </g>
    <!-- Fait — les yeux sourient. Texte collé. Trait, donc lisible en négatif. -->
    <g id="y-fait" fill="none" stroke="var(--cl-trait, #ffffff)" stroke-width="11" stroke-linecap="round">
      <path d="M199,194 A21,21 0 0 1 239,194"/>
      <path d="M273,194 A21,21 0 0 1 313,194"/>
    </g>
    <!-- Vide — globes pleins, sans pupille. Il ne peut rien faire : aucune
         sélection, pas de clé, erreur. -->
    <g id="y-vide">
      <circle cx="219" cy="187.481" r="23.5" fill="var(--cl-oeil, #ffffff)"/>
      <circle cx="293" cy="187.481" r="23.5" fill="var(--cl-oeil, #ffffff)"/>
    </g>
    <!-- Veille — yeux clos. Il se concentre pendant que la réponse arrive. -->
    <g id="y-veille">
      <rect x="198" y="182" width="42" height="11" rx="5.5" fill="var(--cl-trait, #ffffff)"/>
      <rect x="272" y="182" width="42" height="11" rx="5.5" fill="var(--cl-trait, #ffffff)"/>
    </g>

    <!-- Pas de halo d'antenne ici. Deux raisons : posé en aplat il se lit
         comme une pastille collée, et en dégradé il ne suit plus le thème —
         un url() hérite des variables de là où il est défini, pas de là où
         il est utilisé. La lueur d'attente appartient donc à l'implémentation
         (un flou autour de la boule, animé pendant la seule attente), pas au
         dessin partagé. Le point d'ancrage est (256, 96.745), rayon 21,255. -->

    <!-- ── Les douze vues ─────────────────────────────────────────────── -->
    <g id="buste-repos"><use href="#cl-buste"/><use href="#y-repos"/></g>
    <g id="buste-fait"><use href="#cl-buste"/><use href="#y-fait"/></g>
    <g id="buste-vide"><use href="#cl-buste"/><use href="#y-vide"/></g>
    <g id="buste-veille"><use href="#cl-buste"/><use href="#y-veille"/></g>

    <!-- En trait, le globe n'a pas lieu d'être : la pupille seule fait l'œil. -->
    <g id="trait-repos" style="--cl-oeil:transparent;--cl-pupille:var(--cl-trait,#ffffff)"><use href="#cl-trait"/><use href="#y-repos"/></g>
    <g id="trait-fait" style="--cl-oeil:transparent;--cl-pupille:var(--cl-trait,#ffffff)"><use href="#cl-trait"/><use href="#y-fait"/></g>
    <g id="trait-vide" style="--cl-oeil:transparent;--cl-pupille:var(--cl-trait,#ffffff)"><use href="#cl-trait"/><use href="#y-vide"/></g>
    <g id="trait-veille" style="--cl-oeil:transparent;--cl-pupille:var(--cl-trait,#ffffff)"><use href="#cl-trait"/><use href="#y-veille"/></g>
  </defs>

  <!-- Vue par défaut du fichier : le buste au repos. -->
  <use href="#buste-repos"/>
</svg>
