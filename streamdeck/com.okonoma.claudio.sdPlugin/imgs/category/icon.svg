<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 55 392 300" width="28" height="28">
	<!--
		The mascot in outline, the chassis the master drawing keeps for small sizes; its
		shapes are quoted without retouching from icon/claudio_mascotte.svg at the root of
		the repository. Transparent, white, one colour: it suits a template image as it is.
	-->
	<defs>
		<clipPath id="claudio-head-cut"><rect x="120" y="60" width="272" height="211"/></clipPath>
		<path id="claudio-moustache" d="M256,239.765c-26.2,-26.2 -72.05,-22.925 -98.25,6.55c-22.925,26.2 -55.675,32.75 -85.15,16.375c13.1,58.95 62.225,91.7 114.625,75.325c29.475,-9.825 52.4,-32.75 68.775,-58.95c16.375,26.2 39.3,49.125 68.775,58.95c52.4,16.375 101.525,-16.375 114.625,-75.325c-29.475,16.375 -62.225,9.825 -85.15,-16.375c-26.2,-29.475 -72.05,-32.75 -98.25,-6.55Z"/>
		<!-- A flat cut does not follow a curve, so the moustache is what trims the head. -->
		<mask id="claudio-moustache-eraser" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
			<rect x="0" y="0" width="512" height="512" fill="#FFFFFF"/>
			<use href="#claudio-moustache" fill="#000000"/>
		</mask>
	</defs>
	<g fill="none" stroke="#FFFFFF" stroke-width="15" stroke-linejoin="round" stroke-linecap="round">
		<path d="M256,100 L256,127"/>
		<circle cx="256" cy="85" r="17"/>
		<g clip-path="url(#claudio-head-cut)" mask="url(#claudio-moustache-eraser)">
			<rect x="147" y="131" width="217.5" height="205" rx="51.25"/>
		</g>
		<use href="#claudio-moustache"/>
	</g>
	<!-- In outline the globe has no place: the pupil alone makes the eye. -->
	<g fill="#FFFFFF">
		<circle cx="219" cy="187.481" r="12.5"/>
		<circle cx="293" cy="187.481" r="12.5"/>
	</g>
</svg>
