<!doctype html>
<html lang="en">
	<head>
		<title>Window</title>
		<meta charset="utf-8" />
		<script src="./vendor/sdpi-components.js"></script>
		<script src="./locale.js"></script>
	</head>

	<body>
		<sdpi-item label="__MSG_inspector.layout__">
			<sdpi-select setting="layout" default="leftHalf">
				<option value="leftHalf">__MSG_window.leftHalf.label__</option>
				<option value="rightHalf">__MSG_window.rightHalf.label__</option>
				<option value="topHalf">__MSG_window.topHalf.label__</option>
				<option value="bottomHalf">__MSG_window.bottomHalf.label__</option>
				<option value="topLeft">__MSG_window.topLeft.label__</option>
				<option value="topRight">__MSG_window.topRight.label__</option>
				<option value="bottomLeft">__MSG_window.bottomLeft.label__</option>
				<option value="bottomRight">__MSG_window.bottomRight.label__</option>
				<option value="maximize">__MSG_window.maximize.label__</option>
				<option value="center">__MSG_window.center.label__</option>
				<option value="nextScreen">__MSG_window.nextScreen.label__</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
